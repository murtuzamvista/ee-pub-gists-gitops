apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: production

resources:
  - ../../base
  - namespace.yaml

images:
  - name: murtaza1983/ee-pub-gists
    newTag: sha-REPLACE_WITH_APPROVED_COMMIT_SHA

replicas:
  - name: ee-pub-gists
    count: 2

patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: ee-pub-gists
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 200m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 256Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "1"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 512Mi
