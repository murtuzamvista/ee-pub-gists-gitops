name: Validate GitOps manifests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint and validate manifests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: "1.26.2"
          cache: false

      - name: Install validation tools
        run: |
          python3 -m venv "$RUNNER_TEMP/validation-venv"
          "$RUNNER_TEMP/validation-venv/bin/python" -m pip install --disable-pip-version-check yamllint==1.37.1
          echo "$RUNNER_TEMP/validation-venv/bin" >> "$GITHUB_PATH"
          go install github.com/yannh/kubeconform/cmd/kubeconform@v0.7.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Lint YAML and validate Kustomize overlays
        run: bash scripts/validate.sh
