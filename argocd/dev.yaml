apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ee-pub-gists-dev
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/murtuzamvista/ee-pub-gists-gitops.git
    targetRevision: main
    path: overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: ee-pub-gists-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
